<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Indicadores</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b>Centro de Indicadores</b><span>Gestión de desempeño</span></div>
    </div>

    <div class="nav-title">Análisis</div>
    <button class="nav" data-act="nav" data-v="dash"></button>
    <button class="nav" data-act="nav" data-v="ana"></button>
    <button class="nav" data-act="nav" data-v="plan"></button>

    <div class="nav-title">Gestión</div>
    <button class="nav" data-act="nav" data-v="cap"></button>
    <button class="nav" data-act="nav" data-v="goal"></button>
    <button class="nav" data-act="nav" data-v="bulk"></button>
    <button class="nav" data-act="nav" data-v="cat"></button>

    <div class="nav-title">Sistema</div>
    <button class="nav" data-act="nav" data-v="cfg"></button>

    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div><h1 id="ttl"></h1><p id="sub"></p></div>
      <label class="field inline">Año <select id="yearSel" data-bind="year"></select></label>
    </div>
    <section id="view"></section>
  </main>
</div>

<!-- Modal, Toast y Tooltips -->
<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<div id="tip"></div>

<!-- Inputs ocultos para subida de archivos -->
<input type="file" id="fileRestore" accept=".json" class="hide">
<input type="file" id="fileUp" accept=".xlsx,.xlsm,.csv,.txt" class="hide">

<!-- Módulos JavaScript limpios y organizados -->
<script type="module" src="js/app.js"></script>
</body>
</html>
